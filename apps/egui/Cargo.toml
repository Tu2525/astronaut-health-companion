[package]
name = "ahc-safe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Safe-Mode Console: minimal native health console on the same engine"

[dependencies]
ahc-core.workspace = true
serde_json.workspace = true

# Native binary: desktop windowing, events.json in the app data dir.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
directories = "6"

# WASM build served at /safe/ (trunk): canvas, localStorage shared with the web app.
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "EventTarget", "HtmlCanvasElement", "Storage", "StorageEvent", "Window"] }
