name: mobile
# React Native (Expo). CI type-checks, lints and tests; the debug APK is built locally.
on:
  pull_request:
    paths: &paths
      - "apps/mobile/**"
      - "apps/web/src/contract/**"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main]
    paths: *paths
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check apps/mobile exists
        id: guard
        run: |
          if [ -f apps/mobile/package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.guard.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - if: steps.guard.outputs.exists == 'true'
        working-directory: apps/mobile
        run: npm ci
      - if: steps.guard.outputs.exists == 'true'
        working-directory: apps/mobile
        run: npm run typecheck
      - if: steps.guard.outputs.exists == 'true'
        working-directory: apps/mobile
        run: npm run lint
      - if: steps.guard.outputs.exists == 'true'
        working-directory: apps/mobile
        run: npm test
