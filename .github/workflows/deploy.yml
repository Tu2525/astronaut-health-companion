name: deploy
# Builds the web app (and safe mode when it exists) and uploads it to Cloudflare Pages.
# Needs secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and variable AHC_API_URL (public, not a secret).
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  pages:
    runs-on: ubuntu-latest
    env:
      PAGES_PROJECT: ahc
    steps:
      - uses: actions/checkout@v4
      - name: check apps/web exists
        id: guard
        run: |
          if [ -f apps/web/package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.guard.outputs.exists == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - if: steps.guard.outputs.exists == 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.guard.outputs.exists == 'true'
        uses: jetli/wasm-pack-action@v0.4.0
      - if: steps.guard.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - if: steps.guard.outputs.exists == 'true'
        working-directory: apps/web
        run: npm ci && npm run engine
      - if: steps.guard.outputs.exists == 'true'
        working-directory: apps/web
        env:
          VITE_API_URL: ${{ vars.AHC_API_URL }}
        run: npm run build
      # Safe mode (SAFE-3): enabled once apps/egui has an index.html for trunk.
      - name: safe mode into /safe/
        if: steps.guard.outputs.exists == 'true' && hashFiles('apps/egui/index.html') != ''
        run: |
          cargo install trunk --locked
          cd apps/egui && trunk build --release --public-url /safe/ --dist ../web/dist/safe
      - name: deploy
        if: steps.guard.outputs.exists == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=${{ env.PAGES_PROJECT }} --branch=main
