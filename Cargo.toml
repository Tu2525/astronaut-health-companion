[workspace]
resolver = "2"
members = ["crates/core", "crates/core-wasm"]
# Owners add their crate here in their first PR: crates/api, apps/egui, apps/desktop/src-tauri

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ahc-core = { path = "crates/core" }
